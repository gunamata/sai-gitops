{
  "apiVersion": "fleet.cattle.io/v1alpha1",
  "kind": "HelmOp",
  "metadata": {
    "name": "suse-ai-coredns-coredns-system",
    "namespace": "fleet-local"
  },
  "spec": {
    "namespace": "coredns-system",
    "helm": {
      "version": "1.45.2",
      "repo": "oci://dp.apps.rancher.io/charts/coredns",
      "releaseName": "suse-ai-coredns-coredns-system",
      "values": {
        "affinity": {},
        "autoscaler": {
          "affinity": {},
          "configmap": {
            "annotations": {}
          },
          "coresPerReplica": 256,
          "enabled": false,
          "extraContainers": [],
          "image": {
            "pullPolicy": "IfNotPresent",
            "pullSecrets": [],
            "registry": "dp.apps.rancher.io",
            "repository": "containers/cluster-proportional-autoscaler",
            "tag": "1.10.2-1.18"
          },
          "includeUnschedulableNodes": false,
          "livenessProbe": {
            "enabled": true,
            "failureThreshold": 3,
            "initialDelaySeconds": 10,
            "periodSeconds": 5,
            "successThreshold": 1,
            "timeoutSeconds": 5
          },
          "max": 0,
          "min": 0,
          "nodeSelector": {},
          "nodesPerReplica": 16,
          "podAnnotations": {},
          "preventSinglePointFailure": true,
          "priorityClassName": "",
          "resources": {
            "limits": {
              "cpu": "20m",
              "memory": "32Mi"
            },
            "requests": {
              "cpu": "20m",
              "memory": "32Mi"
            }
          },
          "tolerations": []
        },
        "clusterRole": {
          "nameOverride": ""
        },
        "customAnnotations": {},
        "customLabels": {},
        "deployment": {
          "annotations": {},
          "dnsConfig": {},
          "dnsPolicy": "Default",
          "enabled": true,
          "name": "",
          "selector": {},
          "skipConfig": false
        },
        "env": [],
        "extraConfig": {},
        "extraContainers": [],
        "extraSecrets": [],
        "extraVolumeMounts": [],
        "extraVolumes": [],
        "global": {
          "imagePullSecrets": [
            {
              "name": "suse-ai-pull-secret-dp-apps-rancher-io"
            },
            {
              "name": "suse-ai-pull-secret-registry-suse-com"
            }
          ],
          "imageRegistry": ""
        },
        "hpa": {
          "enabled": false,
          "maxReplicas": 2,
          "metrics": [],
          "minReplicas": 1
        },
        "image": {
          "pullPolicy": "IfNotPresent",
          "pullSecrets": [],
          "registry": "dp.apps.rancher.io",
          "repository": "containers/coredns",
          "tag": "1.13.1-2.10"
        },
        "initContainers": [],
        "isClusterService": true,
        "livenessProbe": {
          "enabled": true,
          "failureThreshold": 5,
          "initialDelaySeconds": 60,
          "periodSeconds": 10,
          "successThreshold": 1,
          "timeoutSeconds": 5
        },
        "nodeSelector": {},
        "podAnnotations": {},
        "podDisruptionBudget": {},
        "podLabels": {},
        "podSecurityContext": {},
        "priorityClassName": "",
        "prometheus": {
          "monitor": {
            "additionalLabels": {},
            "enabled": false,
            "interval": "",
            "namespace": "",
            "selector": {}
          },
          "service": {
            "annotations": {
              "prometheus.io/port": "9153",
              "prometheus.io/scrape": "true"
            },
            "enabled": false,
            "selector": {}
          }
        },
        "rbac": {
          "create": true
        },
        "readinessProbe": {
          "enabled": true,
          "failureThreshold": 1,
          "initialDelaySeconds": 30,
          "periodSeconds": 5,
          "successThreshold": 1,
          "timeoutSeconds": 5
        },
        "replicaCount": 1,
        "resources": {
          "limits": {
            "cpu": "100m",
            "memory": "128Mi"
          },
          "requests": {
            "cpu": "100m",
            "memory": "128Mi"
          }
        },
        "rollingUpdate": {
          "maxSurge": "25%",
          "maxUnavailable": 1
        },
        "securityContext": {
          "allowPrivilegeEscalation": false,
          "capabilities": {
            "add": [
              "NET_BIND_SERVICE"
            ],
            "drop": [
              "ALL"
            ]
          },
          "readOnlyRootFilesystem": true
        },
        "servers": [
          {
            "plugins": [
              {
                "name": "errors"
              },
              {
                "configBlock": "lameduck 10s",
                "name": "health"
              },
              {
                "name": "ready"
              },
              {
                "configBlock": "pods insecure\nfallthrough in-addr.arpa ip6.arpa\nttl 30",
                "name": "kubernetes",
                "parameters": "cluster.local in-addr.arpa ip6.arpa"
              },
              {
                "name": "prometheus",
                "parameters": "0.0.0.0:9153"
              },
              {
                "name": "forward",
                "parameters": ". /etc/resolv.conf"
              },
              {
                "name": "cache",
                "parameters": 30
              },
              {
                "name": "loop"
              },
              {
                "name": "reload"
              },
              {
                "name": "loadbalance"
              }
            ],
            "port": 53,
            "zones": [
              {
                "use_tcp": true,
                "zone": "."
              }
            ]
          }
        ],
        "service": {
          "annotations": {},
          "name": "",
          "selector": {}
        },
        "serviceAccount": {
          "annotations": {},
          "create": false,
          "name": ""
        },
        "serviceType": "ClusterIP",
        "terminationGracePeriodSeconds": 30,
        "tolerations": [],
        "topologySpreadConstraints": [],
        "zoneFiles": [],
        "imagePullSecrets": [
          {
            "name": "suse-ai-pull-secret-dp-apps-rancher-io"
          },
          {
            "name": "suse-ai-pull-secret-registry-suse-com"
          }
        ]
      }
    },
    "targets": [
      {
        "clusterName": "local"
      }
    ],
    "helmSecretName": "application-collection-auth"
  }
}