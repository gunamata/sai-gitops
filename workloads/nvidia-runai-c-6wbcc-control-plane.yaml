        "content": "apiVersion: kustomize.config.k8s.io/v1beta1\nkind: Kustomization\nresources:\n  - registrar.yaml\nconfigMapGenerator:\n  - name: runai-registrar-script\n    namespace: runai-backend\n    files:\n      - registrar.py\n",
        "name": "overlay/kustomization.yaml"
