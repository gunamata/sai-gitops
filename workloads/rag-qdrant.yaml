  },
  "spec": {
    "helm": {
      "releaseName": "rag-qdrant",
      "repo": "oci://registry.suse.com/ai/charts/qdrant",
      "values": {
        "global": {
          "imagePullSecrets": [
            {
              "name": "suse-ai-pull-combined"
