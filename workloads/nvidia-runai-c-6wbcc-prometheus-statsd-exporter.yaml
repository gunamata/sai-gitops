        "content": "apiVersion: v1\nkind: ServiceAccount\nmetadata:\n  name: runai-preflight\n  namespace: runai-backend\n---\napiVersion: rbac.authorization.k8s.io/v1\nkind: ClusterRole\nmetadata:\n  name: runai-preflight\nrules:\n  - apiGroups: [\"\"]\n    resources: [nodes]\n    verbs: [list]\n  - apiGroups: [storage.k8s.io]\n    resources: [storageclasses]\n    verbs: [list]\n  - apiGroups: [networking.k8s.io]\n    resources: [ingressclasses]\n    verbs: [list]\n  - apiGroups: [apiextensions.k8s.io]\n    resources: [customresourcedefinitions]\n    verbs: [get]\n---\napiVersion: rbac.authorization.k8s.io/v1\nkind: ClusterRoleBinding\nmetadata:\n  name: runai-preflight\nroleRef:\n  apiGroup: rbac.authorization.k8s.io\n  kind: ClusterRole\n  name: runai-preflight\nsubjects:\n  - kind: ServiceAccount\n    name: runai-preflight\n    namespace: runai-backend\n---\napiVersion: rbac.authorization.k8s.io/v1\nkind: Role\nmetadata:\n  name: runai-preflight\n  namespace: runai-backend\nrules:\n  - apiGroups: [\"\"]\n    resources: [configmaps]\n    verbs: [create]\n  - apiGroups: [\"\"]\n    resources: [configmaps]\n    resourceNames: [runai-preflight-result]\n    verbs: [get, update]\n  - apiGroups: [cert-manager.io]\n    resources: [certificates]\n    resourceNames: [runai-ca]\n    verbs: [get]\n---\napiVersion: rbac.authorization.k8s.io/v1\nkind: RoleBinding\nmetadata:\n  name: runai-preflight\n  namespace: runai-backend\nroleRef:\n  apiGroup: rbac.authorization.k8s.io\n  kind: Role\n  name: runai-preflight\nsubjects:\n  - kind: ServiceAccount\n    name: runai-preflight\n    namespace: runai-backend\n---\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: runai-preflight\n  namespace: runai-backend\n  labels:\n    app.kubernetes.io/name: runai-preflight\nspec:\n  replicas: 1\n  strategy:\n    type: Recreate\n  selector:\n    matchLabels:\n      app.kubernetes.io/name: runai-preflight\n  template:\n    metadata:\n      labels:\n        app.kubernetes.io/name: runai-preflight\n    spec:\n      serviceAccountName: runai-preflight\n      securityContext:\n        runAsNonRoot: true\n        runAsUser: 65532\n        runAsGroup: 65532\n        seccompProfile:\n          type: RuntimeDefault\n      containers:\n        - name: preflight\n          image: registry.suse.com/bci/python:3.12\n          command: [python3, /scripts/preflight.py]\n          # Summed over all nodes; see preflight.py. Lower them only on a cluster you know is enough.\n          env:\n            - name: PREFLIGHT_MIN_CORES\n              value: \"20\"\n            - name: PREFLIGHT_MIN_MEMORY_GB\n              value: \"32\"\n            - name: PREFLIGHT_MIN_STORAGE_GB\n              value: \"160\"\n          readinessProbe:\n            exec:\n              command: [python3, /scripts/preflight.py, --ready]\n            periodSeconds: 30\n            timeoutSeconds: 10\n          resources:\n            requests:\n              cpu: 20m\n              memory: 64Mi\n          securityContext:\n            allowPrivilegeEscalation: false\n            readOnlyRootFilesystem: true\n            capabilities:\n              drop: [ALL]\n          volumeMounts:\n            - name: script\n              mountPath: /scripts\n              readOnly: true\n            - name: tmp\n              mountPath: /tmp\n      volumes:\n        - name: script\n          configMap:\n            name: runai-preflight-script\n        - name: tmp\n          emptyDir: {}\n",
