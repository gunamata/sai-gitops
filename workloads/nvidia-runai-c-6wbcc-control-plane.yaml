        "content": "apiVersion: v1\nkind: ServiceAccount\nmetadata:\n  name: runai-registrar\n  namespace: runai-backend\n---\napiVersion: rbac.authorization.k8s.io/v1\nkind: Role\nmetadata:\n  name: runai-registrar\n  namespace: runai-backend\n# Only the objects registrar.py reads or writes; RBACTest in tests/test_registrar.py\n# checks every request it makes against these rules.\n# create can't be limited by resourceNames, so it has its own rules.\nrules:\n  - apiGroups: [\"\"]\n    resources: [secrets, configmaps]\n    verbs: [create]\n  - apiGroups: [\"\"]\n    resources: [secrets]\n    resourceNames: [runai-backend-gen-tenants-manager, runai-backend-tls, runai-wildcard-tls]\n    verbs: [get]\n  - apiGroups: [\"\"]\n    resources: [secrets]\n    resourceNames: [runai-registrar-credentials, runai-cluster-values]\n    verbs: [get, update]\n  - apiGroups: [\"\"]\n    resources: [configmaps]\n    resourceNames: [runai-backend-tenants-manager]\n    verbs: [get]\n  - apiGroups: [\"\"]\n    resources: [configmaps]\n    resourceNames: [runai-install-info]\n    verbs: [get, update]\n  - apiGroups: [cert-manager.io]\n    resources: [certificates]\n    verbs: [create]\n  - apiGroups: [cert-manager.io]\n    resources: [certificates]\n    resourceNames: [runai-wildcard]\n    verbs: [get, update]\n  - apiGroups: [networking.k8s.io]\n    resources: [ingresses]\n    resourceNames: [runai-backend-ingress]\n    verbs: [get]\n---\napiVersion: rbac.authorization.k8s.io/v1\nkind: RoleBinding\nmetadata:\n  name: runai-registrar\n  namespace: runai-backend\nroleRef:\n  apiGroup: rbac.authorization.k8s.io\n  kind: Role\n  name: runai-registrar\nsubjects:\n  - kind: ServiceAccount\n    name: runai-registrar\n    namespace: runai-backend\n---\napiVersion: rbac.authorization.k8s.io/v1\nkind: Role\nmetadata:\n  name: runai-registrar\n  namespace: runai\nrules:\n  - apiGroups: [\"\"]\n    resources: [secrets]\n    verbs: [create]\n  - apiGroups: [\"\"]\n    resources: [secrets]\n    resourceNames: [runai-ca-cert, runai-cluster-domain-star-tls-secret]\n    verbs: [get, update]\n  - apiGroups: [networking.k8s.io]\n    resources: [ingresses]\n    verbs: [create]\n  - apiGroups: [networking.k8s.io]\n    resources: [ingresses]\n    resourceNames: [runai-cluster-domain-star-ingress]\n    verbs: [get, update]\n---\napiVersion: rbac.authorization.k8s.io/v1\nkind: RoleBinding\nmetadata:\n  name: runai-registrar\n  namespace: runai\nroleRef:\n  apiGroup: rbac.authorization.k8s.io\n  kind: Role\n  name: runai-registrar\nsubjects:\n  - kind: ServiceAccount\n    name: runai-registrar\n    namespace: runai-backend\n---\n# One replica and Recreate: two registrars must never run at once.\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: runai-registrar\n  namespace: runai-backend\n  labels:\n    app.kubernetes.io/name: runai-registrar\nspec:\n  replicas: 1\n  strategy:\n    type: Recreate\n  selector:\n    matchLabels:\n      app.kubernetes.io/name: runai-registrar\n  template:\n    metadata:\n      labels:\n        app.kubernetes.io/name: runai-registrar\n    spec:\n      serviceAccountName: runai-registrar\n      securityContext:\n        runAsNonRoot: true\n        runAsUser: 65532\n        runAsGroup: 65532\n        seccompProfile:\n          type: RuntimeDefault\n      containers:\n        - name: registrar\n          image: registry.suse.com/bci/python:3.12\n          command: [python3, /scripts/registrar.py]\n          env:\n            - name: RUNAI_CHART_VERSION\n              value: \"2.26.50\"\n            - name: RUNAI_REGISTRAR_PERMISSION_SETS\n              value: \"Cluster edit,Service accounts edit\"\n          readinessProbe:\n            exec:\n              command: [python3, /scripts/registrar.py, --ready]\n            periodSeconds: 30\n            timeoutSeconds: 10\n          resources:\n            requests:\n              cpu: 20m\n              memory: 64Mi\n          securityContext:\n            allowPrivilegeEscalation: false\n            readOnlyRootFilesystem: true\n            capabilities:\n              drop: [ALL]\n          volumeMounts:\n            - name: script\n              mountPath: /scripts\n              readOnly: true\n            - name: tmp\n              mountPath: /tmp\n      volumes:\n        - name: script\n          configMap:\n            name: runai-registrar-script\n        - name: tmp\n          emptyDir: {}\n",
        "name": "overlay/registrar.yaml"
